# A chaque tag vX.Y.Z : compile le node et le lanceur pour les 4 plateformes,
# puis cree la release EN BROUILLON avec version.txt. Les signatures (.sig)
# sont ajoutees ensuite, la ou se trouve la cle du node principal :
#     launcher --sign X.Y.Z <dossier des 8 exe>
# puis la release est publiee a la main.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x86_64.exe
            suffix: .exe
          - runner: windows-11-arm
            platform: windows-aarch64.exe
            suffix: .exe
          - runner: ubuntu-latest
            platform: linux-x86_64
            suffix: ""
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            suffix: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Compiler
        run: cargo build --release -p unirique_node -p launcher

      - name: Nommer
        shell: bash
        run: |
          mkdir out
          cp target/release/node${{ matrix.suffix }} out/node-${{ matrix.platform }}
          cp target/release/launcher${{ matrix.suffix }} out/launcher-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Version
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > out/version.txt

      # En brouillon : elle ne devient la derniere release qu'une fois les
      # signatures ajoutees et la release publiee a la main.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
